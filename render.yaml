# Render blueprint for an invite-only private preview.
# Set SIGNUP_CODE in the Render dashboard (marked sync: false, so it never lives in the repo).
# Without it, nobody can create a new company account. Invited colleagues never need it.
services:
  - type: web
    name: easycontract-preview
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SIGNUP_CODE
        sync: false
